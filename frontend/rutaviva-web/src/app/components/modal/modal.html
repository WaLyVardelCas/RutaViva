@if (open()) {
  <div class="backdrop" [class.side]="side()" (click)="dismiss()">
    <div
      class="dialog"
      [class.panel]="side()"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      (click)="keepOpen($event)">
      <div class="heading">
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (side()) {
          <button class="close" type="button" aria-label="Cerrar" (click)="dismiss()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        }
      </div>
      <div class="body">
        <ng-content />
      </div>
      <div class="actions">
        <ng-content select="[modalActions]" />
      </div>
    </div>
  </div>
}
