<div class="start">
  <h1>{{ title() }}</h1>
</div>

<div class="roles" role="group" aria-label="Cambiar vista">
  <button
    appButton
    type="button"
    [variant]="roles.role() === role.Client ? 'primary' : 'secondary'"
    [attr.aria-pressed]="roles.role() === role.Client"
    (click)="choose(role.Client)">
    Cliente
  </button>
  <button
    appButton
    type="button"
    [variant]="roles.role() === role.Workshop ? 'primary' : 'secondary'"
    [attr.aria-pressed]="roles.role() === role.Workshop"
    (click)="choose(role.Workshop)">
    Taller
  </button>
</div>
