<div class="top">
  <button
    class="hamburger"
    type="button"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'"
    aria-controls="sidebar-nav"
    (click)="toggled.emit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>
</div>

<a class="brand" [routerLink]="home()" (click)="navigated.emit()">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16c2.5-5 5-8 8-8s5.5 3 8 8" />
      <path d="M8 16h.01M12 16h.01M16 16h.01" />
    </svg>
  </span>
  <span>
    <span class="name">RutaViva</span>
    <span class="slogan">Tu flota siempre en ruta.</span>
  </span>
</a>

<nav id="sidebar-nav" class="nav" aria-label="Principal">
  @for (item of items(); track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="navigated.emit()">
      <app-nav-icon [icon]="item.icon" />
      <span class="label">{{ item.label }}</span>
    </a>
  }
</nav>

<p class="view">{{ viewName() }}</p>
