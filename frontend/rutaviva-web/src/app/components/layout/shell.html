<a class="skip" href="#contenido">Saltar al contenido</a>

@if (mobile() && menuOpen()) {
  <button class="backdrop" type="button" tabindex="-1" aria-label="Cerrar menú" (click)="menuOpen.set(false)"></button>
}

<app-sidebar [open]="menuOpen()" (toggled)="toggleMenu()" (navigated)="closeAfterNavigation()" />
<div class="rail-spacer" [class.expanded]="menuOpen() && !mobile()" aria-hidden="true"></div>

<div class="workspace">
  <app-header [title]="heading()" />
  <main id="contenido" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>

<button
  class="refresh"
  type="button"
  [class.busy]="portal.refreshing()"
  [attr.aria-busy]="portal.refreshing()"
  aria-label="Actualizar"
  (click)="portal.load()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8" />
    <path d="M21 3v5h-5" />
    <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16" />
    <path d="M3 21v-5h5" />
  </svg>
  <span class="tooltip" aria-hidden="true">Actualizar</span>
</button>

<app-toaster />
